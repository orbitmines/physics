# GENERATED by `npx ray gen` from implementation/gen/Release.ray and each language's `release_job` - do not edit
# A push to main that changes languages/VERSION builds every package, keeps what it built as artifacts, publishes to
# every registry whose credentials are set, and makes the GitHub release. Run it by hand to build only (or to publish).
name: release
on:
  push:
    branches: [main]
    paths: [languages/VERSION]
  workflow_dispatch:
    inputs:
      publish:
        description: publish to the registries, not only build and keep the artifacts
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      testing: ${{ steps.v.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: v
        run: |
          v="$(cat languages/VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then publish="${{ inputs.publish }}"
          elif git diff --quiet HEAD^ HEAD -- languages/VERSION; then publish=false
          else publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "testing=true" ;; *) echo "testing=false" ;; esac >> "$GITHUB_OUTPUT"
          echo "version $v, publishing: $publish"
  typescript:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_CREDENTIALS: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: pack
        run: mkdir -p out && cd languages/physics.ts && npm pack --pack-destination ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: typescript
          path: out/
          if-no-files-found: error
      - name: publish to npm (@orbitmines/physics)
        if: env.PUBLISH == 'true' && env.HAS_CREDENTIALS == 'true'
        run: cd languages/physics.ts && npm publish --access public --provenance --tag ${{ env.TESTING == 'true' && 'test' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  python:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
      TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: pip install build && python -m build languages/physics.py --outdir out
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: out/
          if-no-files-found: error
      - name: publish to PyPI (orbitmines-physics), with a token
        if: env.PUBLISH == 'true' && env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: out/
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: publish to PyPI (orbitmines-physics), as a trusted publisher
        if: env.PUBLISH == 'true' && env.HAS_TOKEN != 'true' && env.TRUSTED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: out/
  ruby:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_CREDENTIALS: ${{ secrets.RUBYGEMS_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: build
        run: mkdir -p out && cd languages/physics.rb && gem build orbitmines-physics.gemspec && mv *.gem ../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: ruby
          path: out/
          if-no-files-found: error
      - name: publish to RubyGems (orbitmines-physics)
        if: env.PUBLISH == 'true' && env.HAS_CREDENTIALS == 'true'
        run: gem push out/*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
  java:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_CREDENTIALS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_PASSWORD != '' && secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: build
        run: mvn -B -f languages/physics.java/pom.xml package && mkdir -p out && cp languages/physics.java/target/*.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: java
          path: out/
          if-no-files-found: error
      - name: publish to Maven Central (com.orbitmines:physics)
        if: env.PUBLISH == 'true' && env.HAS_CREDENTIALS == 'true'
        run: mvn -B -f languages/physics.java/pom.xml -P release -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
  csharp:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_KEY: ${{ secrets.NUGET_API_KEY != '' }}
      TRUSTED: ${{ vars.NUGET_USER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: pack
        run: dotnet pack languages/physics.cs/OrbitMines.Physics.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: csharp
          path: out/
          if-no-files-found: error
      - name: sign in to NuGet as a trusted publisher (a key for this run alone)
        id: nuget
        if: env.PUBLISH == 'true' && env.HAS_KEY != 'true' && env.TRUSTED == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: publish to NuGet (OrbitMines.Physics)
        if: env.PUBLISH == 'true' && (env.HAS_KEY == 'true' || env.TRUSTED == 'true')
        run: dotnet nuget push "out/*.nupkg" --api-key "${NUGET_API_KEY:-$TRUSTED_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          TRUSTED_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
  go:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: cd languages/physics.go && go build ./... && go vet ./... && mkdir -p ../../out && tar czf ../../out/physics.go-0.0.1-test.1.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: go
          path: out/
          if-no-files-found: error
      - name: publish to the Go module proxy (a tag is the release)
        if: env.PUBLISH == 'true'
        run: |
          git tag "languages/physics.go/v0.0.1-test.1" && git push origin "languages/physics.go/v0.0.1-test.1"
          curl -fsS "https://proxy.golang.org/github.com/orbitmines/physics/languages/physics.go/@v/v0.0.1-test.1.info" || true
  cpp:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - name: build and install
        run: |
          cmake -S languages/physics.cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          cmake --install build --prefix install/orbitmines-physics
          mkdir -p out
          tar czf out/orbitmines-physics-0.0.1-test.1-linux-x64.tar.gz -C install orbitmines-physics
          tar czf out/orbitmines-physics-0.0.1-test.1-source.tar.gz -C languages physics.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: cpp
          path: out/
          if-no-files-found: error
      - name: vcpkg and Conan take a port by pull request
        if: env.PUBLISH == 'true'
        run: echo "C++ is released as the GitHub release's source archive; vcpkg (microsoft/vcpkg ports/orbitmines-physics) and Conan (conan-io/conan-center-index) take a pull request pointing at it"
  rust:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      HAS_CREDENTIALS: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: package
        run: cargo package --manifest-path languages/physics.rs/Cargo.toml --allow-dirty && mkdir -p out && cp languages/physics.rs/target/package/*.crate out/
      - uses: actions/upload-artifact@v4
        with:
          name: rust
          path: out/
          if-no-files-found: error
      - name: publish to crates.io (orbitmines-physics)
        if: env.PUBLISH == 'true' && env.HAS_CREDENTIALS == 'true'
        run: cargo publish --manifest-path languages/physics.rs/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  lean:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: build the package and check the theorems
        run: cd languages/physics.lean && lake exe cache get && lake build
      - name: package
        run: mkdir -p out && tar czf out/orbitmines-physics-lean-0.0.1-test.1.tar.gz --exclude .lake -C languages physics.lean
      - uses: actions/upload-artifact@v4
        with:
          name: lean
          path: out/
          if-no-files-found: error
      - name: Reservoir reads the release's tag
        if: env.PUBLISH == 'true'
        run: echo "Lean is released by the repository tag v0.0.1-test.1, which the release job creates and Reservoir indexes"
  swift:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: swift build -c release --package-path languages/physics.swift && mkdir -p out && tar czf out/OrbitMinesPhysics-0.0.1-test.1.tar.gz -C languages physics.swift --exclude .build
      - uses: actions/upload-artifact@v4
        with:
          name: swift
          path: out/
          if-no-files-found: error
      - name: SwiftPM reads the release's tag
        if: env.PUBLISH == 'true'
        run: echo "Swift is released by the repository tag v0.0.1-test.1 (the release job); the Swift Package Index lists it once the repository carries a root Package.swift"
  julia:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
      REGISTER: ${{ vars.JULIA_REGISTRATOR == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: load
        run: julia --project=languages/physics.jl -e 'using Pkg; Pkg.instantiate(); using OrbitMinesPhysics' && mkdir -p out && tar czf out/OrbitMinesPhysics-0.0.1-test.1.tar.gz -C languages physics.jl
      - uses: actions/upload-artifact@v4
        with:
          name: julia
          path: out/
          if-no-files-found: error
      - name: register in Julia's General registry (a test release is not registered - General takes no pre-releases)
        if: env.PUBLISH == 'true' && env.REGISTER == 'true' && env.TESTING != 'true'
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body='@JuliaRegistrator register subdir=languages/physics.jl'
        env:
          GH_TOKEN: ${{ github.token }}
  r:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: build
        run: mkdir -p out && cd out && R CMD build ../languages/physics.r
      - uses: actions/upload-artifact@v4
        with:
          name: r
          path: out/
          if-no-files-found: error
      - name: CRAN takes a package by its web form; r-universe builds it from the repository
        if: env.PUBLISH == 'true'
        run: echo "submit out/orbitmines_0.0.1.9001.tar.gz at https://cran.r-project.org/submit.html (a test release goes to r-universe only)"
  wolfram:
    needs: version
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TESTING: ${{ needs.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
      - name: pack the paclet
        run: mkdir -p out && cd languages/physics.wl && zip -r "../../out/OrbitMines__Physics-0.0.1.9001.paclet" . -x README.md
      - uses: actions/upload-artifact@v4
        with:
          name: wolfram
          path: out/
          if-no-files-found: error
      - name: the Wolfram Paclet Repository takes a paclet by submission
        if: env.PUBLISH == 'true'
        run: echo "submit out/OrbitMines__Physics-0.0.1.9001.paclet through the Paclet Repository's submission notebook (resources.wolframcloud.com/PacletRepository)"
  release:
    needs: [version, typescript, python, ruby, java, csharp, go, cpp, rust, lean, swift, julia, r, wolfram]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: the GitHub release, every package attached (and the tag Swift and Lean read)
        run: gh release create "v${{ needs.version.outputs.version }}" artifacts/*/* --target "${{ github.sha }}" --title "v${{ needs.version.outputs.version }}" --generate-notes ${{ needs.version.outputs.testing == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
